<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Drift · Expense Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"/>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; min-height: 100%; height: 100%;
        background: #fdf6f0;
        font-family: 'Geist', -apple-system, system-ui, sans-serif;
        color: #2a1c14;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
      }
      body.dark { background: #1a1410; color: #f6ece2; }
      #root { height: 100%; }
      button { font-family: inherit; }
      input, select, textarea { font-family: inherit; }
      /* iOS safe-area */
      @supports (padding: max(0px)) {
        body { padding-top: env(safe-area-inset-top); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
